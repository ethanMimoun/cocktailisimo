<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0807">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Admin · Cocktailisimo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Italiana&family=Inter:wght@300;400;500;600&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0807;
    --bg-velvet: #14100d;
    --bg-marble: #1a1612;
    --cream: #f5ecd9;
    --cream-dim: #d9cfb8;
    --gold: #c9a961;
    --gold-bright: #e6c878;
    --gold-deep: #8b6f3a;
    --ink: #0a0807;
    --line: rgba(201, 169, 97, 0.25);
    --line-soft: rgba(245, 236, 217, 0.08);
    --shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    --status-new: #4a90e2;
    --status-confirmed: #c9a961;
    --status-delivery: #e6a23c;
    --status-delivered: #67c23a;
    --status-cancelled: #f56c6c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    scroll-behavior: smooth;
    background: #0a0807;
    background-color: #0a0807;
  }
  body {
    background: #0a0807;
    background-color: #0a0807;
    color: #f5ecd9;
    font-family: 'Cormorant Garamond', 'Heebo', serif;
    font-weight: 300;
    min-height: 100vh;
    line-height: 1.5;
  }
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: var(--bg-velvet);
    border: 1px solid var(--gold);
    padding: 60px 50px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    position: relative;
    box-shadow: var(--shadow);
  }
  .login-box::before {
    content: '';
    position: absolute;
    inset: 12px;
    border: 1px solid var(--line);
    pointer-events: none;
  }
  .login-mark {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .login-box h1 {
    font-family: 'Italiana', serif;
    font-size: 32px;
    color: var(--cream);
    letter-spacing: 0.2em;
    margin-bottom: 8px;
  }
  .login-box .sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--cream-dim);
    margin-bottom: 36px;
  }
  .login-form { text-align: right; }
  .login-field { margin-bottom: 20px; }
  .login-field label {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--cream-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .login-field input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 10px 0;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    color: var(--cream);
    transition: border-color 0.3s;
    direction: ltr;
    text-align: right;
  }
  .login-field input:focus {
    outline: none;
    border-bottom-color: var(--gold);
  }
  .login-btn {
    width: 100%;
    background: var(--gold);
    color: var(--ink);
    border: none;
    padding: 18px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.4s ease;
    font-weight: 600;
    margin-top: 12px;
  }
  .login-btn:hover { background: var(--cream); }
  .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .login-error {
    color: var(--status-cancelled);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    margin-top: 16px;
    min-height: 20px;
  }
  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--line);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .full-loader {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
  }
  .full-loader .spinner { width: 40px; height: 40px; }
  .full-loader p {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--cream-dim);
  }
  .admin-top {
    border-bottom: 1px solid var(--line);
    padding: 24px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-velvet);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .admin-logo {
    font-family: 'Italiana', serif;
    font-size: 22px;
    letter-spacing: 0.4em;
    color: var(--cream);
    text-transform: uppercase;
    display: flex;
    align-items: center;
  }
  .admin-logo .badge {
    color: var(--gold);
    font-size: 11px;
    letter-spacing: 0.3em;
    margin-left: 12px;
    border: 1px solid var(--gold);
    padding: 4px 10px;
  }
  .admin-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .admin-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--cream);
    padding: 8px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.25em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s ease;
  }
  .admin-btn:hover { border-color: var(--gold); color: var(--gold); }
  .admin-btn.primary {
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
  }
  .admin-btn.primary:hover { background: var(--gold-bright); color: var(--ink); }
  .notif-status {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--cream-dim);
  }
  .notif-status.granted { color: var(--status-delivered); }
  .live-pulse {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--status-delivered);
    border-radius: 50%;
    margin-right: 12px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(103, 194, 58, 0.6); }
    50% { opacity: 0.6; box-shadow: 0 0 0 8px rgba(103, 194, 58, 0); }
  }
  .admin-content { padding: 32px 40px; max-width: 1400px; margin: 0 auto; }
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    margin-bottom: 32px;
    border: 1px solid var(--line-soft);
    background: var(--line-soft);
  }
  .stat-card { background: var(--bg-velvet); padding: 24px; }
  .stat-card .label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .stat-card .value {
    font-family: 'Italiana', serif;
    font-size: 36px;
    color: var(--cream);
    line-height: 1;
  }
  .stat-card .sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--cream-dim);
    margin-top: 8px;
  }
  .filters {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    align-items: center;
  }
  .filter-search {
    flex: 1;
    min-width: 240px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--cream);
    padding: 12px 16px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    direction: rtl;
  }
  .filter-search:focus { outline: none; border-color: var(--gold); }
  .filter-pill {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--cream-dim);
    padding: 8px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s ease;
  }
  .filter-pill:hover { border-color: var(--gold); color: var(--gold); }
  .filter-pill.active {
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
  }
  .orders-list { display: flex; flex-direction: column; gap: 12px; }
  .order-card {
    border: 1px solid var(--line-soft);
    background: var(--bg-velvet);
    transition: border-color 0.3s ease;
    overflow: hidden;
  }
  .order-card:hover { border-color: var(--line); }
  .order-card.expanded { border-color: var(--gold); }
  .order-header {
    padding: 20px 24px;
    display: grid;
    grid-template-columns: auto 1fr auto auto auto;
    gap: 24px;
    align-items: center;
    cursor: pointer;
  }
  .order-id {
    font-family: 'Italiana', serif;
    font-size: 16px;
    color: var(--gold);
    letter-spacing: 0.15em;
    min-width: 90px;
  }
  .order-customer .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    color: var(--cream);
    margin-bottom: 2px;
  }
  .order-customer .meta {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--cream-dim);
    text-transform: uppercase;
  }
  .order-delivery {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--cream-dim);
    text-align: center;
  }
  .order-delivery .date {
    color: var(--cream);
    font-style: normal;
    font-size: 16px;
    display: block;
    margin-bottom: 2px;
  }
  .order-total {
    font-family: 'Italiana', serif;
    font-size: 22px;
    color: var(--gold);
  }
  .status-badge {
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    letter-spacing: 0.3em;
    padding: 6px 12px;
    text-transform: uppercase;
    border: 1px solid;
    min-width: 100px;
    text-align: center;
  }
  .status-new { color: var(--status-new); border-color: var(--status-new); }
  .status-confirmed { color: var(--status-confirmed); border-color: var(--status-confirmed); }
  .status-in_delivery { color: var(--status-delivery); border-color: var(--status-delivery); }
  .status-delivered { color: var(--status-delivered); border-color: var(--status-delivered); }
  .status-cancelled { color: var(--status-cancelled); border-color: var(--status-cancelled); opacity: 0.7; }
  .order-body {
    display: none;
    padding: 24px;
    border-top: 1px solid var(--line-soft);
    background: var(--bg-marble);
  }
  .order-card.expanded .order-body { display: block; }
  .order-body-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1.2fr;
    gap: 32px;
    margin-bottom: 24px;
  }
  .info-block h4 {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line-soft);
  }
  .info-block p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    color: var(--cream-dim);
    line-height: 1.7;
  }
  .info-block .value { color: var(--cream); font-size: 16px; }
  .items-table { width: 100%; border-collapse: collapse; }
  .items-table th, .items-table td {
    padding: 8px 0;
    text-align: right;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    border-bottom: 1px solid var(--line-soft);
  }
  .items-table th {
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    padding-bottom: 12px;
  }
  .items-table td.item-name { color: var(--cream); }
  .items-table td.item-price { color: var(--gold); font-family: 'Italiana', serif; }
  .order-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding-top: 20px;
    border-top: 1px solid var(--line-soft);
  }
  .order-actions .label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--cream-dim);
    text-transform: uppercase;
    align-self: center;
    margin-left: 8px;
  }
  .status-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--cream);
    padding: 8px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s ease;
  }
  .status-btn:hover { border-color: var(--gold); color: var(--gold); }
  .status-btn.danger:hover { border-color: var(--status-cancelled); color: var(--status-cancelled); }
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--cream-dim);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
  }
  .empty-state .mark {
    font-family: 'Italiana', serif;
    font-size: 60px;
    color: var(--gold);
    margin-bottom: 16px;
  }
  @media (max-width: 900px) {
    .admin-top { padding: 16px 20px; flex-wrap: wrap; gap: 12px; }
    .admin-content { padding: 20px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .order-header { grid-template-columns: 1fr 1fr; gap: 12px; }
    .order-id, .order-delivery, .order-total, .status-badge { font-size: 13px; }
    .order-body-grid { grid-template-columns: 1fr; gap: 20px; }
    .login-box { padding: 40px 28px; }
  }
</style>
</head>
<body>

<div id="initial-loader" class="full-loader">
  <div class="spinner"></div>
  <p>טוען...</p>
</div>

<div id="login-screen" class="login-screen" style="display: none;">
  <div class="login-box">
    <div class="login-mark">— Admin Access</div>
    <h1>COCKTAILISIMO</h1>
    <p class="sub">התחבר כדי לנהל הזמנות</p>
    <form class="login-form" id="login-form">
      <div class="login-field">
        <label>אימייל</label>
        <input type="email" id="login-email" required autocomplete="email">
      </div>
      <div class="login-field">
        <label>סיסמה</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="login-submit">כניסה למערכת</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>
</div>

<div id="admin-app" style="display: none;">
  <div class="admin-top">
    <div class="admin-logo">
      <span class="live-pulse" id="live-indicator" title="מחובר"></span>
      <span class="badge">ADMIN</span>
      COCKTAILISIMO
    </div>
    <div class="admin-actions">
      <span class="notif-status" id="notif-status">התראות מבוטלות</span>
      <button class="admin-btn" id="notif-btn">הפעל התראות</button>
      <button class="admin-btn" id="export-btn">ייצוא CSV</button>
      <button class="admin-btn" id="logout-btn">התנתק</button>
      <a href="index.html" class="admin-btn primary" style="text-decoration:none; display:inline-block;">לאתר →</a>
    </div>
  </div>

  <div class="admin-content">
    <div class="stats-row" id="stats-row"></div>

    <div class="filters">
      <input type="text" class="filter-search" id="filter-search" placeholder="חיפוש לפי שם, טלפון, מספר הזמנה...">
      <button class="filter-pill active" data-status="all">הכל</button>
      <button class="filter-pill" data-status="new">חדשות</button>
      <button class="filter-pill" data-status="confirmed">אושרו</button>
      <button class="filter-pill" data-status="in_delivery">במשלוח</button>
      <button class="filter-pill" data-status="delivered">נמסרו</button>
      <button class="filter-pill" data-status="cancelled">בוטלו</button>
    </div>

    <div class="orders-list" id="orders-list"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, collection, query, orderBy, onSnapshot,
  doc, updateDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6EHzlwE_s6jJcoutbGJxf9E5nGPrT8ck",
  authDomain: "cocktailisimo-4019e.firebaseapp.com",
  projectId: "cocktailisimo-4019e",
  storageBucket: "cocktailisimo-4019e.firebasestorage.app",
  messagingSenderId: "1007535853660",
  appId: "1:1007535853660:web:ee0c54df9cdbacf9ec1699",
  measurementId: "G-WVEGHWYBK2"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const HEBREW_DAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const HEBREW_MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];

const STATUS_LABELS = {
  new: 'חדש', confirmed: 'אושר', in_delivery: 'במשלוח',
  delivered: 'נמסר', cancelled: 'בוטל'
};

const STATUS_FLOW = {
  new: ['confirmed', 'cancelled'],
  confirmed: ['in_delivery', 'cancelled'],
  in_delivery: ['delivered', 'cancelled'],
  delivered: [],
  cancelled: []
};

let allOrders = [];
let activeFilter = 'all';
let searchQuery = '';
let expandedOrderId = null;
let knownOrderIds = new Set();
let isFirstLoad = true;
let unsubscribeFirestore = null;

// Auth flow
onAuthStateChanged(auth, (user) => {
  document.getElementById('initial-loader').style.display = 'none';
  if (user) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-app').style.display = 'block';
    startListening();
  } else {
    document.getElementById('admin-app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    if (unsubscribeFirestore) {
      unsubscribeFirestore();
      unsubscribeFirestore = null;
    }
  }
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  const submitBtn = document.getElementById('login-submit');

  errorEl.textContent = '';
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span>';

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    let msg = 'שגיאה בהתחברות';
    if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
      msg = 'מייל או סיסמה שגויים';
    } else if (err.code === 'auth/invalid-email') {
      msg = 'כתובת מייל לא תקינה';
    } else if (err.code === 'auth/too-many-requests') {
      msg = 'יותר מדי ניסיונות. נסה שוב בעוד מספר דקות.';
    }
    errorEl.textContent = msg;
    submitBtn.disabled = false;
    submitBtn.textContent = 'כניסה למערכת';
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  if (confirm('להתנתק מהמערכת?')) {
    await signOut(auth);
  }
});

// Firestore real-time listener
function startListening() {
  isFirstLoad = true;
  knownOrderIds = new Set();
  const q = query(collection(db, 'orders'), orderBy('createdAt', 'desc'));

  unsubscribeFirestore = onSnapshot(q, (snapshot) => {
    const orders = [];
    snapshot.forEach((d) => {
      orders.push({ docId: d.id, ...d.data() });
    });

    if (!isFirstLoad) {
      const newOnes = orders.filter(o => !knownOrderIds.has(o.docId));
      if (newOnes.length > 0) {
        newOnes.forEach(o => notifyNewOrder(o));
      }
    }

    knownOrderIds = new Set(orders.map(o => o.docId));
    isFirstLoad = false;
    allOrders = orders;
    render();
  }, (err) => {
    console.error('Firestore listener error:', err);
    document.getElementById('orders-list').innerHTML = `
      <div class="empty-state">
        <div class="mark">!</div>
        שגיאה בחיבור לבסיס הנתונים. ודא שאתה מחובר ושכללי האבטחה מאפשרים גישה.<br>
        <span style="font-size: 13px; color: var(--cream-dim);">${err.message}</span>
      </div>
    `;
  });
}

function notifyNewOrder(order) {
  if ('Notification' in window && Notification.permission === 'granted') {
    const notif = new Notification('🍸 הזמנה חדשה — Cocktailisimo', {
      body: `${order.customer.name} | ${order.total}₪ | ${order.delivery.dateLabel} ${order.delivery.time}`,
      tag: order.docId,
      requireInteraction: true
    });
    notif.onclick = () => {
      window.focus();
      expandedOrderId = order.docId;
      render();
      notif.close();
    };
  }
  // Audio cue
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}
}

// Order operations
async function updateOrderStatus(docId, newStatus) {
  try {
    await updateDoc(doc(db, 'orders', docId), {
      status: newStatus,
      statusUpdatedAt: new Date().toISOString()
    });
  } catch (err) {
    alert('שגיאה בעדכון סטטוס: ' + err.message);
  }
}

async function deleteOrderFromDb(docId) {
  if (!confirm('למחוק את ההזמנה לגמרי? פעולה זו אינה הפיכה.')) return;
  try {
    await deleteDoc(doc(db, 'orders', docId));
  } catch (err) {
    alert('שגיאה במחיקה: ' + err.message);
  }
}

function toggleExpand(docId) {
  expandedOrderId = expandedOrderId === docId ? null : docId;
  render();
}

window.updateOrderStatus = updateOrderStatus;
window.deleteOrderFromDb = deleteOrderFromDb;
window.toggleExpand = toggleExpand;

// Render
function render() {
  const statsRow = document.getElementById('stats-row');
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayISO = dateToISO(today);

  const todayOrders = allOrders.filter(o => o.delivery && o.delivery.date === todayISO);
  const newOrders = allOrders.filter(o => o.status === 'new');
  const inProgress = allOrders.filter(o => ['confirmed', 'in_delivery'].includes(o.status));
  const totalRevenue = allOrders
    .filter(o => o.status === 'delivered')
    .reduce((s, o) => s + (o.total || 0), 0);

  statsRow.innerHTML = `
    <div class="stat-card">
      <div class="label">חדשות</div>
      <div class="value">${newOrders.length}</div>
      <div class="sub">ממתינות לאישור</div>
    </div>
    <div class="stat-card">
      <div class="label">בתהליך</div>
      <div class="value">${inProgress.length}</div>
      <div class="sub">אושרו או יצאו</div>
    </div>
    <div class="stat-card">
      <div class="label">להיום</div>
      <div class="value">${todayOrders.length}</div>
      <div class="sub">משלוחים מתוכננים</div>
    </div>
    <div class="stat-card">
      <div class="label">הכנסות</div>
      <div class="value">${totalRevenue}₪</div>
      <div class="sub">סה"כ מהזמנות שנמסרו</div>
    </div>
  `;

  let filtered = allOrders;
  if (activeFilter !== 'all') {
    filtered = filtered.filter(o => o.status === activeFilter);
  }
  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(o =>
      (o.orderNumber || '').toLowerCase().includes(q) ||
      ((o.customer && o.customer.name) || '').toLowerCase().includes(q) ||
      ((o.customer && o.customer.phone) || '').includes(q)
    );
  }

  const list = document.getElementById('orders-list');
  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="mark">∅</div>
        ${allOrders.length === 0 ? 'עדיין לא הגיעו הזמנות' : 'אין הזמנות התואמות לסינון'}
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map(order => renderOrderCard(order)).join('');
}

function renderOrderCard(order) {
  const isExpanded = order.docId === expandedOrderId;
  const itemsTotal = (order.items || []).reduce((s, i) => s + (i.qty || 0), 0);

  const header = `
    <div class="order-header" onclick="toggleExpand('${order.docId}')">
      <div class="order-id">${escapeHtml(order.orderNumber || '—')}</div>
      <div class="order-customer">
        <div class="name">${escapeHtml(order.customer.name)}</div>
        <div class="meta">${escapeHtml(order.customer.phone)} · ${itemsTotal} פריטים</div>
      </div>
      <div class="order-delivery">
        <span class="date">${escapeHtml(order.delivery.dateLabel)}</span>
        ${escapeHtml(order.delivery.time)} · ${escapeHtml(order.address.city)}
      </div>
      <div class="order-total">${order.total}₪</div>
      <div class="status-badge status-${order.status}">${STATUS_LABELS[order.status] || order.status}</div>
    </div>
  `;

  const itemsRows = (order.items || []).map(i => `
    <tr>
      <td class="item-name">${escapeHtml(i.name)} <span style="color:var(--cream-dim); font-style:italic; font-size: 12px;">${i.size}ml</span></td>
      <td>× ${i.qty}</td>
      <td class="item-price">${i.lineTotal}₪</td>
    </tr>
  `).join('');

  const statusBtns = (STATUS_FLOW[order.status] || []).map(next => `
    <button class="status-btn ${next === 'cancelled' ? 'danger' : ''}"
            onclick="event.stopPropagation(); updateOrderStatus('${order.docId}', '${next}')">
      ${getActionLabel(next)}
    </button>
  `).join('');

  const callPhone = (order.customer.phone || '').replace(/[^0-9]/g, '');
  const waPhone = callPhone.startsWith('0') ? '972' + callPhone.slice(1) : callPhone;

  const body = `
    <div class="order-body">
      <div class="order-body-grid">
        <div class="info-block">
          <h4>לקוח</h4>
          <p><span class="value">${escapeHtml(order.customer.name)}</span></p>
          <p>${escapeHtml(order.customer.phone)}</p>
          ${order.customer.email ? `<p>${escapeHtml(order.customer.email)}</p>` : ''}
        </div>
        <div class="info-block">
          <h4>משלוח</h4>
          <p><span class="value">${escapeHtml(order.delivery.dateLabel)}</span></p>
          <p>שעה: ${escapeHtml(order.delivery.time)} (±60 דק׳)</p>
          <p>${escapeHtml(order.address.street)}, ${escapeHtml(order.address.city)}</p>
          ${order.address.notes ? `<p style="font-style:italic; margin-top: 8px;">${escapeHtml(order.address.notes)}</p>` : ''}
        </div>
        <div class="info-block">
          <h4>פריטים</h4>
          <table class="items-table">${itemsRows}</table>
          <p style="margin-top: 12px;">
            תשלום: <span class="value">${order.payment.method === 'card' ? 'אשראי' : 'מזומן בדלת'}</span>
          </p>
          ${order.coupon ? `
            <p style="margin-top: 8px; padding: 8px 12px; background: rgba(201, 169, 97, 0.08); border: 1px dashed #c9a961;">
              <span style="font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 0.3em; color: #c9a961; text-transform: uppercase;">קופון:</span><br>
              <span class="value">${escapeHtml(order.coupon.code)}</span>
              <span style="color: var(--cream-dim); font-style: italic; font-size: 13px;"> · ${order.coupon.percent}% הנחה (-${order.coupon.discountAmount}₪)</span>
              ${order.coupon.source ? `<br><span style="font-size: 11px; color: var(--cream-dim); font-style: italic;">מקור: ${escapeHtml(order.coupon.source)}</span>` : ''}
            </p>
          ` : ''}
          ${order.subtotal && order.discount ? `
            <p style="margin-top: 8px; font-family: 'Cormorant Garamond', serif; font-size: 13px; color: var(--cream-dim);">
              סכום מקורי: ${order.subtotal}₪ · הנחה: -${order.discount}₪ · סה"כ: <span class="value">${order.total}₪</span>
            </p>
          ` : ''}
        </div>
      </div>
      <div class="order-actions">
        <span class="label">פעולות:</span>
        ${statusBtns}
        <a href="tel:${callPhone}" class="status-btn" style="text-decoration:none; display:inline-block;" onclick="event.stopPropagation()">📞 התקשר</a>
        <a href="https://wa.me/${waPhone}" target="_blank" class="status-btn" style="text-decoration:none; display:inline-block;" onclick="event.stopPropagation()">💬 וואטסאפ</a>
        <button class="status-btn danger" onclick="event.stopPropagation(); deleteOrderFromDb('${order.docId}')">🗑 מחק</button>
      </div>
    </div>
  `;

  return `<div class="order-card ${isExpanded ? 'expanded' : ''}">${header}${body}</div>`;
}

function getActionLabel(nextStatus) {
  const labels = {
    confirmed: '✓ אשר הזמנה',
    in_delivery: '🚗 יצא למשלוח',
    delivered: '✓ נמסר ללקוח',
    cancelled: '✕ בטל'
  };
  return labels[nextStatus] || nextStatus;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function dateToISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

// Filters
document.querySelectorAll('.filter-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    activeFilter = pill.dataset.status;
    render();
  });
});

document.getElementById('filter-search').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  render();
});

// Notifications
function updateNotifStatus() {
  const status = document.getElementById('notif-status');
  const btn = document.getElementById('notif-btn');
  if (!('Notification' in window)) {
    status.textContent = 'דפדפן לא תומך';
    btn.style.display = 'none';
    return;
  }
  if (Notification.permission === 'granted') {
    status.textContent = '✓ התראות פעילות';
    status.classList.add('granted');
    btn.style.display = 'none';
  } else if (Notification.permission === 'denied') {
    status.textContent = 'התראות נחסמו';
  } else {
    status.textContent = 'התראות מבוטלות';
  }
}

document.getElementById('notif-btn').addEventListener('click', () => {
  if (!('Notification' in window)) {
    alert('הדפדפן לא תומך בהתראות');
    return;
  }
  Notification.requestPermission().then(perm => {
    updateNotifStatus();
    if (perm === 'granted') {
      new Notification('🍸 Cocktailisimo Admin', {
        body: 'התראות הופעלו! תקבל הודעה על כל הזמנה חדשה.'
      });
    }
  });
});

updateNotifStatus();

// Export CSV
document.getElementById('export-btn').addEventListener('click', () => {
  if (allOrders.length === 0) {
    alert('אין הזמנות לייצא');
    return;
  }

  const headers = ['ID', 'תאריך הזמנה', 'סטטוס', 'שם', 'טלפון', 'אימייל', 'עיר', 'כתובת', 'הערות', 'תאריך אספקה', 'שעת אספקה', 'תשלום', 'פריטים', 'סה״כ'];
  const rows = allOrders.map(o => [
    o.orderNumber || '',
    o.createdAt && o.createdAt.toDate ? o.createdAt.toDate().toLocaleString('he-IL') : '',
    STATUS_LABELS[o.status] || o.status,
    o.customer.name,
    o.customer.phone,
    o.customer.email || '',
    o.address.city,
    o.address.street,
    o.address.notes || '',
    o.delivery.dateLabel,
    o.delivery.time,
    o.payment.method === 'card' ? 'אשראי' : 'מזומן',
    (o.items || []).map(i => `${i.name} x${i.qty}`).join(' | '),
    o.total
  ]);

  const csv = [headers, ...rows].map(row =>
    row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')
  ).join('\n');

  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cocktailisimo-orders-${dateToISO(new Date())}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});
</script>
